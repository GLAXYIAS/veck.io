name: Deploy Veck.io

on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/main.css"
      - ".github/workflows/deploy-veck.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prepare the pinned official Veck.io build
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f site/Build/ce3c479a1f014daba5313ddedba65494.data ] \
             || [ ! -f site/Build/27c8e281cd1c44ea329198df58829657.wasm ] \
             || [ ! -f site/StreamingAssets/aa0.0.2482/WebGL/local_assets_matchmakepanel_b4cd876f0da7fc2eb5a0bd7f03456775.bundle ]; then
            curl --fail --location --silent --show-error \
              --retry 6 --retry-all-errors --retry-delay 2 \
              --connect-timeout 20 --max-time 300 \
              -H 'Accept-Encoding: identity' \
              'https://files.catbox.moe/150den.gz' -o /tmp/veck-assets.tar.gz
            echo 'e9a799a4e4de30e15323cd4f124bd50a00db7e65671108fa87e3921ca6b48d1e  /tmp/veck-assets.tar.gz' \
              | sha256sum --check --strict
            tar -xzf /tmp/veck-assets.tar.gz -C site
          fi

          sha256sum --check --strict <<'SUMS'
          88480d6d880a38d8fcf2b27e1d9fa5f9d27857600ccfb71400ad8ef12c169cef  site/Build/b50c16868b108a7cb71d1125f7db04f4.loader.js
          40760a0a9b10b6d67ebc411d0b3518e87ce8043790c95aeeb640d44ee86c3614  site/Build/ce3c479a1f014daba5313ddedba65494.data
          6908ed74a746f5d0ac96d18c1cad744045ccb37eb724f770fdc7353e481b5664  site/Build/a813a63f343de92a67ba91660691efb7.framework.js
          ed123c369aedd1564f8736ebc52dc29079b1bf24788ad18ad3f02497c369b8bb  site/Build/27c8e281cd1c44ea329198df58829657.wasm
          88263ffd2b3e548dce315598f0c120fcecbbab710cdca8a86a2bb6c1cbf00022  site/StreamingAssets/aa0.0.2482/settings.json
          468ef4b38d9a44a01047701b947b96ab717e97a808678ea259df4c7a8e9efd2e  site/StreamingAssets/aa0.0.2482/catalog.bin
          7942e0ca072c6f95e32de7155fbbd2d68fb42e5bc109edf94ae2b45c57698e6a  site/StreamingAssets/aa0.0.2482/WebGL/local_assets_adventure_33b0bfd06e55f6690ef0bdbe4e67c69d.bundle
          fbb496427edb77cd726e74a6cbd63e41737433f09d3bc63bcf79e061a71ec8fc  site/StreamingAssets/aa0.0.2482/WebGL/local_assets_gem_bcf294b87841540d50b71a99e1c28236.bundle
          fd42f668b2ad24f2163d6d8c67a2a0c5e4afce1e8d3aa21360f62c11ac81189f  site/StreamingAssets/aa0.0.2482/WebGL/local_assets_leaderboardpanel_bf912a9edb9b1a8e5855727ce4b56aa0.bundle
          09d3f35c25e4f406c8d1bf99a00731952bcd9991917fdd73f2e2bcc6c5222af2  site/StreamingAssets/aa0.0.2482/WebGL/local_assets_matchmakepanel_b4cd876f0da7fc2eb5a0bd7f03456775.bundle
          b222ed9863c5bc9c58b5b69607ff55dfbd7883fb5f11088de7af13140758a99b  site/StreamingAssets/aa0.0.2482/WebGL/local_assets_missions_4f53a2508f36fa1f66c712e9b15e7919.bundle
          86638fb307110997336f7a9db3ec2f23d64afa1e80b97a68d2ad50d507274f67  site/StreamingAssets/aa0.0.2482/WebGL/local_assets_nvtefrendspanel_7b183605a15deb233d8fb09b541ca88e.bundle
          9ecda331f48b5c8f6b3063ef588c90bc97955cd3761a0a7bae9a902563b972c4  site/StreamingAssets/aa0.0.2482/WebGL/local_assets_playwthfrendspanel_c7771adb2c17426bf7f514ae97223c31.bundle
          1f13f89decd7955db1808b3f3a89baa2b804f116b21b4ab11271d2682b0b0362  site/logo-v2.webp
          39a13753e7e2e825b64504236c60af4a12f900a0c579f2e9212ddf7a65b6d37f  site/bg-v2.webp
          SUMS

          find site -type f -printf '%s %p\n' | sort -n

      - name: Store the build files in the repository
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/Build site/StreamingAssets site/logo-v2.webp site/bg-v2.webp
          if git diff --cached --quiet; then
            echo "Build files are already committed."
            exit 0
          fi
          git commit -m "Add official Veck.io build files"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
